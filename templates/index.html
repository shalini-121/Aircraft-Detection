<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aircraft Detection System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1200px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .upload-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 40px;
        }

        .upload-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 3px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .upload-box:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-box input[type="file"] {
            display: none;
        }

        .upload-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .upload-text {
            color: #667eea;
            font-size: 1.1em;
            font-weight: 600;
            text-align: center;
        }

        .upload-subtext {
            color: #999;
            font-size: 0.9em;
            margin-top: 10px;
            text-align: center;
        }

        .settings {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .setting-group label {
            font-weight: 600;
            color: #333;
            font-size: 1em;
        }

        .confidence-slider {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .confidence-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            transition: background 0.3s;
        }

        .confidence-slider::-webkit-slider-thumb:hover {
            background: #764ba2;
        }

        .confidence-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
            transition: background 0.3s;
        }

        .confidence-slider::-moz-range-thumb:hover {
            background: #764ba2;
        }

        .confidence-value {
            text-align: center;
            font-size: 1.2em;
            color: #667eea;
            font-weight: bold;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 15px 30px;
            font-size: 1em;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .detect-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .detect-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .detect-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .reset-btn {
            background: #e0e0e0;
            color: #333;
        }

        .reset-btn:hover {
            background: #d0d0d0;
        }

        .model-select {
            width: 100%;
            padding: 10px;
            border: 2px solid #667eea;
            border-radius: 6px;
            font-size: 0.95em;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .model-select:hover {
            border-color: #764ba2;
        }

        .model-select:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .results {
            display: none;
            margin-top: 40px;
            padding-top: 40px;
            border-top: 2px solid #eee;
        }

        .results.show {
            display: block;
        }

        .results h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .result-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 30px;
        }

        .result-image {
            text-align: center;
        }

        .result-image img {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .detection-stats {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .stat-box {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #333;
        }

        .detections-list {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
            max-height: 400px;
            overflow-y: auto;
        }

        .detections-list h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.1em;
        }

        .detection-item {
            background: white;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            border-left: 3px solid #667eea;
            font-size: 0.9em;
        }

        .detection-item:last-child {
            margin-bottom: 0;
        }

        .detection-item strong {
            color: #333;
        }

        .detection-confidence {
            color: #667eea;
            font-weight: bold;
        }

        .download-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .loading {
            display: none;
            text-align: center;
            padding: 30px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .error {
            display: none;
            background: #ffe0e0;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #c33;
        }

        .error.show {
            display: block;
        }

        .filename {
            color: #667eea;
            font-weight: 600;
            margin-top: 10px;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            .upload-section {
                grid-template-columns: 1fr;
            }

            .result-content {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8em;
            }

            .container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>✈️ Aircraft Detection System</h1>
        <p class="subtitle">Upload an image to detect aircraft using AI</p>

        <div class="upload-section">
            <div class="upload-box" id="uploadBox">
                <div class="upload-icon">📸</div>
                <div class="upload-text">Click to upload image</div>
                <div class="upload-subtext">or drag and drop</div>
                <input type="file" id="fileInput" accept="image/*">
            </div>

            <div class="settings">
                <div class="setting-group">
                    <label>Detection Model</label>
                    <select id="modelSelect" class="model-select">
                        <option value="">Loading models...</option>
                    </select>
                </div>

                <div class="setting-group">
                    <label>Confidence Threshold</label>
                    <input type="range" id="confidenceSlider" min="0.1" max="0.9" step="0.1" value="0.3"
                        class="confidence-slider">
                    <div class="confidence-value" id="confidenceValue">30%</div>
                </div>

                <div class="button-group">
                    <button class="detect-btn" id="detectBtn" disabled>Detect Aircraft</button>
                    <button class="reset-btn" id="resetBtn">Reset</button>
                </div>
            </div>
        </div>

        <div class="error" id="error"></div>
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Processing image...</p>
        </div>

        <div class="results" id="results">
            <h2>Detection Results</h2>
            <div class="result-content">
                <div class="result-image">
                    <img id="resultImage" alt="Detection result">
                </div>
                <div class="detection-stats">
                    <div class="stat-box">
                        <div class="stat-label">Model Used</div>
                        <div class="stat-value" id="modelUsed" style="font-size: 1.2em;">-</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Total Aircraft Detected</div>
                        <div class="stat-value" id="detectionCount">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Image Dimensions</div>
                        <div class="stat-value" id="imageDimensions" style="font-size: 1.2em;">-</div>
                    </div>
                    <div class="detections-list" id="detectionsList">
                        <h3>Detections</h3>
                        <div id="detectionsContent"></div>
                    </div>
                </div>
            </div>
            <button class="download-btn" id="downloadBtn">⬇️ Download Result</button>
        </div>
    </div>

    <script>
        const uploadBox = document.getElementById('uploadBox');
        const fileInput = document.getElementById('fileInput');
        const detectBtn = document.getElementById('detectBtn');
        const resetBtn = document.getElementById('resetBtn');
        const confidenceSlider = document.getElementById('confidenceSlider');
        const confidenceValue = document.getElementById('confidenceValue');
        const modelSelect = document.getElementById('modelSelect');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const results = document.getElementById('results');
        const downloadBtn = document.getElementById('downloadBtn');
        const resultImage = document.getElementById('resultImage');

        let selectedFile = null;
        let detectionResult = null;

        // Load available models on page load
        async function loadAvailableModels() {
            try {
                const response = await fetch('/models');
                const data = await response.json();

                console.log('Models response:', data);

                modelSelect.innerHTML = '';

                const modelDescriptions = {
                    'faster_rcnn': 'Faster R-CNN (Balanced)',
                    'retinanet': 'RetinaNet (Better for Small Objects)'
                };

                if (!data.available_models || data.available_models.length === 0) {
                    modelSelect.innerHTML = '<option value="">No models available - Check server</option>';
                    console.error('No models loaded:', data);
                    return;
                }

                data.available_models.forEach(model => {
                    const option = document.createElement('option');
                    option.value = model;
                    option.textContent = modelDescriptions[model] || model;
                    if (model === data.default_model) {
                        option.selected = true;
                    }
                    modelSelect.appendChild(option);
                });
            } catch (err) {
                console.error('Failed to load models:', err);
                modelSelect.innerHTML = '<option value="">Error loading models</option>';
            }
        }

        // Load models when page loads
        loadAvailableModels();

        // Upload box click
        uploadBox.addEventListener('click', () => fileInput.click());

        // File input change
        fileInput.addEventListener('change', (e) => {
            selectedFile = e.target.files[0];
            if (selectedFile) {
                detectBtn.disabled = false;
                uploadBox.querySelector('.upload-text').textContent = 'File selected: ' + selectedFile.name;
                error.classList.remove('show');
            }
        });

        // Drag and drop
        uploadBox.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadBox.style.borderColor = '#764ba2';
            uploadBox.style.background = '#f0f2ff';
        });

        uploadBox.addEventListener('dragleave', () => {
            uploadBox.style.borderColor = '#667eea';
            uploadBox.style.background = '#f8f9ff';
        });

        uploadBox.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadBox.style.borderColor = '#667eea';
            uploadBox.style.background = '#f8f9ff';

            const files = e.dataTransfer.files;
            if (files.length > 0) {
                fileInput.files = files;
                selectedFile = files[0];
                detectBtn.disabled = false;
                uploadBox.querySelector('.upload-text').textContent = 'File selected: ' + selectedFile.name;
                error.classList.remove('show');
            }
        });

        // Confidence slider
        confidenceSlider.addEventListener('input', (e) => {
            const value = (e.target.value * 100).toFixed(0);
            confidenceValue.textContent = value + '%';
        });

        // Detect button
        detectBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('confidence', confidenceSlider.value);
            formData.append('model', modelSelect.value);

            loading.classList.add('show');
            error.classList.remove('show');
            results.classList.remove('show');

            try {
                const response = await fetch('/detect', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Detection failed');
                }

                detectionResult = data;
                displayResults(data);
                results.classList.add('show');

            } catch (err) {
                showError(err.message);
            } finally {
                loading.classList.remove('show');
            }
        });

        // Reset button
        resetBtn.addEventListener('click', () => {
            fileInput.value = '';
            selectedFile = null;
            detectBtn.disabled = true;
            results.classList.remove('show');
            error.classList.remove('show');
            uploadBox.querySelector('.upload-text').textContent = 'Click to upload image';
            uploadBox.querySelector('.upload-subtext').textContent = 'or drag and drop';
        });

        // Download button
        downloadBtn.addEventListener('click', async () => {
            if (!detectionResult) return;

            try {
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: detectionResult.image })
                });

                if (!response.ok) throw new Error('Download failed');

                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'detection_result.png';
                a.click();
                window.URL.revokeObjectURL(url);
            } catch (err) {
                showError('Failed to download image: ' + err.message);
            }
        });

        function displayResults(data) {
            document.getElementById('resultImage').src = data.image;

            // Display model name with better formatting
            const modelNames = {
                'faster_rcnn': 'Faster R-CNN',
                'retinanet': 'RetinaNet'
            };
            document.getElementById('modelUsed').textContent = modelNames[data.model] || data.model;

            document.getElementById('detectionCount').textContent = data.count;
            document.getElementById('imageDimensions').textContent = data.original_size;

            const detectionsContent = document.getElementById('detectionsContent');
            detectionsContent.innerHTML = '';

            if (data.detections.length === 0) {
                detectionsContent.innerHTML = '<p style="color: #999;">No aircraft detected</p>';
            } else {
                data.detections.forEach(det => {
                    const div = document.createElement('div');
                    div.className = 'detection-item';
                    div.innerHTML = `
                        <strong>Aircraft #${det.id}</strong><br>
                        Confidence: <span class="detection-confidence">${(det.confidence * 100).toFixed(1)}%</span><br>
                        Box: [${det.box.map(v => v.toFixed(0)).join(', ')}]
                    `;
                    detectionsContent.appendChild(div);
                });
            }
        }

        function showError(message) {
            error.textContent = '❌ ' + message;
            error.classList.add('show');
        }
    </script>
</body>

</html>
